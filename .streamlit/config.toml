# dipop theme — Franklin & Marshall blue (official brand palette)
#   True Blue #003DA5 · Heritage Navy #041E42 · Lux Blue #009CDE · Limestone #F3F1E6
[theme]
base = "light"

# color
primaryColor = "#003DA5"              # F&M True Blue — CTAs, links, active nav
backgroundColor = "#FFFFFF"           # clean paper
secondaryBackgroundColor = "#F1F4F9"  # cool blue-grey surface (cards, sidebar, widgets)
textColor = "#041E42"                 # F&M Heritage Navy ink
linkColor = "#003DA5"

# shape
baseRadius = "0.75rem"
borderColor = "#E1E6EF"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 16

# type — characterful display + clean workhorse body
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap"
font = "Hanken Grotesk:https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#F7F9FC"
borderColor = "#E1E6EF"
